<!doctype html>
<html lang="zh-CN" data-color-mode="dark">
  <head>
    <meta charset="utf-8" />
    <title>内容工作台</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f0f0f;
        color: #eeeeee;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI',
          'Microsoft YaHei', sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      .wrap {
        display: flex;
        height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .mark {
        display: flex;
        height: 40px;
        width: 40px;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        background: #eeeeee;
        color: #0f0f0f;
        font-size: 18px;
        font-weight: 700;
      }
      .title {
        font-size: 13px;
        letter-spacing: 0.04em;
        color: #eeeeee;
      }
      .hint {
        font-size: 11px;
        color: #6b6b6b;
      }
      .bar {
        position: relative;
        height: 2px;
        width: 120px;
        overflow: hidden;
        border-radius: 2px;
        background: #2a2a2a;
      }
      .bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 2px;
        background: #eeeeee;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(300%);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">W</div>
      <div class="title">内容工作台</div>
      <div class="bar"></div>
      <div class="hint">正在启动本地服务…</div>
    </div>
  </body>
</html>
