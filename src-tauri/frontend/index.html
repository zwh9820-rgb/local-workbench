<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>本地个人工作台</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f7f6f3;
        color: #1f2937;
        font-family: 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif;
        user-select: none;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .logo {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: #1f4e5f;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #f0f7f9;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 1px;
      }
      .title {
        font-size: 14px;
        font-weight: 600;
      }
      .hint {
        font-size: 12px;
        color: #6b7280;
      }
      .bar {
        width: 180px;
        height: 3px;
        border-radius: 999px;
        background: #d9ecf2;
        overflow: hidden;
      }
      .bar > i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #3d97b5;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">W</div>
      <div class="title">本地个人工作台</div>
      <div class="hint">正在启动本地服务…</div>
      <div class="bar"><i></i></div>
    </div>
  </body>
</html>
