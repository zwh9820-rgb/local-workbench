name: CI

# 轻量检查：类型 + Web 构建（不跑 Rust，几十秒出结果）
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & Web build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Next.js build
        run: npm run build

      # smoke 脚本需要一条会话记录，先灌示例数据（幂等）
      - name: Seed demo data
        run: npm run db:seed

      - name: Smoke test agent tools
        run: npm run smoke:tools
