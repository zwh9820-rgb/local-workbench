name: Build Windows Installer

# 触发方式：
#   1. 推送 tag（v1.0.0 / v2.0.0 …）→ 自动构建并把 exe 挂到 Release
#   2. 手动 Run workflow → 只在 Actions 里产出 artifact
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------------------
      # 1) 构建 Next.js standalone 产物（自带精简 node_modules）
      # ---------------------------------------------------------------
      - name: Build Next.js (standalone)
        run: npm run build
        env:
          NEXT_OUTPUT: standalone

      # ---------------------------------------------------------------
      # 2) 组装 sidecar 应用目录
      #    脚本内部会：复制 standalone → 剔除本地数据库 → 复制静态资源
      #    与 drizzle 迁移 → 补齐被 Next 裁剪掉的模块 → 校验原生模块
      # ---------------------------------------------------------------
      - name: Assemble sidecar app
        run: node scripts/prepare-desktop.mjs

      # ---------------------------------------------------------------
      # 3) 下载 Node 运行时（作为 sidecar 启动 Next 服务）
      # ---------------------------------------------------------------
      - name: Fetch Node runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "src-tauri/resources" | Out-Null
          $url = "https://nodejs.org/dist/latest-v22.x/win-x64/node.exe"
          Invoke-WebRequest -Uri $url -OutFile "src-tauri/resources/node.exe"
          $len = (Get-Item "src-tauri/resources/node.exe").Length
          Write-Host "node.exe: $([math]::Round($len/1MB,1)) MB"
          if ($len -lt 50000000) { throw "node.exe 下载异常（体积过小）" }

      # ---------------------------------------------------------------
      # 4) Rust + Tauri 构建
      # ---------------------------------------------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Generate icons
        run: npx tauri icon src-tauri/icon.png -o src-tauri/icons

      - name: Build Tauri bundle
        run: npx tauri build

      # ---------------------------------------------------------------
      # 5) 产物：安装器 + 便携版
      # ---------------------------------------------------------------
      - name: Package portable zip
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/*.exe" | Select-Object -First 1
          $dir = "portable/AI-Content-Workbench"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item $exe.FullName "$dir/"
          Copy-Item -Recurse -Force "src-tauri/resources" "$dir/resources"
          Compress-Archive -Path "$dir/*" -DestinationPath "portable/AI-Content-Workbench-portable.zip" -Force
          Write-Host "portable zip ready"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: portable/*.zip
          if-no-files-found: warn

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            portable/*.zip
          generate_release_notes: true
          draft: false
